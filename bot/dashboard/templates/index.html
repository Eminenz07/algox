<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ALGOX Trading Bot — Live Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>

<!-- ── Header ──────────────────────────────────────────────── -->
<header class="header">
  <div class="header-left">
    <div class="logo">
      <span class="logo-icon">🚀</span>
      <span class="logo-text">ALGOX<span class="logo-sub"> BOT</span></span>
    </div>
    <div class="status-pill" id="statusPill">
      <span class="status-dot"></span>
      <span id="statusText">Connecting…</span>
    </div>
  </div>
  <div class="header-right">
    <div class="stat-box">
      <span class="stat-label">EQUITY</span>
      <span class="stat-value" id="balance">—</span>
    </div>
    <div class="stat-box">
      <span class="stat-label">UPTIME</span>
      <span class="stat-value" id="uptime">—</span>
    </div>
    <div class="stat-box">
      <span class="stat-label">ACTIVE</span>
      <span class="stat-value" id="activeCount">0</span>
    </div>
  </div>
</header>

<!-- ── Tab Navigation ────────────────────────────────────── -->
<div class="tabs-nav-wrap">
  <div class="tabs-nav">
    <button class="tab-btn active" id="btn-dashboard" onclick="switchTab('dashboard')">📈 Live Dashboard</button>
    <button class="tab-btn" id="btn-logs" onclick="switchTab('logs')">📋 System Logs</button>
    <button class="tab-btn" id="btn-settings" onclick="switchTab('settings')">⚙️ Settings</button>
  </div>
</div>

<!-- ── Main content ────────────────────────────────────────── -->
<main class="content">

  <!-- TAB: Dashboard -->
  <div id="tab-dashboard" class="tab-pane active">
    <!-- Active Trades -->
    <section class="section">
      <h2 class="section-title">⚡ Active Trades</h2>
      <div class="cards-grid" id="tradesGrid">
        <div class="empty-state">No open positions. Waiting for signal…</div>
      </div>
    </section>

    <!-- Trade History -->
    <section class="section">
      <h2 class="section-title">📋 Trade History</h2>
      <div class="table-wrap">
        <table class="hist-table">
          <thead>
            <tr>
              <th>Symbol</th>
              <th>Dir</th>
              <th>Entry</th>
              <th>Close</th>
              <th>Outcome</th>
              <th>PnL (USDT)</th>
              <th>Duration</th>
            </tr>
          </thead>
          <tbody id="histBody">
            <tr><td colspan="7" class="empty-row">No history yet</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <!-- TAB: Logs -->
  <div id="tab-logs" class="tab-pane">
    <section class="section">
      <div class="section-header">
        <h2 class="section-title">📋 System Logs</h2>
        <button class="btn-refresh" onclick="fetchLogs()">🔄 Refresh Logs</button>
      </div>
      <div class="log-container">
        <pre id="logPre">Loading logs...</pre>
      </div>
    </section>
  </div>

  <!-- TAB: Settings -->
  <div id="tab-settings" class="tab-pane">
    <section class="section">
      <h2 class="section-title">⚙️ Bot Settings</h2>
      <div class="settings-grid" id="settingsContainer">
        <div class="empty-state">Loading settings...</div>
      </div>
    </section>
  </div>

</main>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script src="{{ url_for('static', filename='dashboard.js') }}"></script>
</body>
</html>
