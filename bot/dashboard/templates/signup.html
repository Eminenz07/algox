<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ALGOX SaaS — Sign Up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body class="auth-body">

<div class="auth-card glass-card">
  <div class="logo auth-logo">
    <span class="logo-icon">🚀</span>
    <span class="logo-text">ALGOX</span>
  </div>
  
  <h2>Create your Account</h2>
  <p class="subtitle">Join the automated Bybit Demo trading environment.</p>
  
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, msg in messages %}
        <div class="status-alert {{ 'error' if category == 'error' else 'success' }}">
          {{ msg }}
        </div>
      {% endfor %}
    {% endif %}
  {% endwith %}
  
  <form action="{{ url_for('signup') }}" method="POST">
    <div class="input-group">
      <label>Email Address</label>
      <input type="email" name="email" placeholder="you@example.com" required />
    </div>
    <div class="input-group">
      <label>Username</label>
      <input type="text" name="username" placeholder="His_Emi" required />
    </div>
    <div class="input-group">
      <label>Password</label>
      <input type="password" name="password" placeholder="••••••••" required />
    </div>
    <button type="submit" class="btn-primary auth-btn">Create Account</button>
  </form>
  
  <div class="auth-footer">
    <span>Already have an account? <a href="{{ url_for('login') }}">Log in instead</a></span>
  </div>
</div>

</body>
</html>
